name: Hardware CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structure-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate multi-module structure and version alignment
        run: python3 scripts/validate_modules.py
